name: Autonomous AI Trading Bot

on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  run-analyst-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Code
        uses: actions/checkout@v4

      - name: Wake up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Data Science Libraries
        run: pip install -r requirements.txt

      - name: Execute Trading Scan
        env:
          # This tells GitHub: "Take my Secret and call it ALPACA_API_KEY inside the script"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python analyst.py
